<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Email Assistant</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f232c;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --muted: #9aa3af;
    --accent: #4f8cff;
    --accent-2: #6ee7b7;
    --danger: #f87171;
    --user: #2b3550;
    --agent: #222732;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .status { margin-left: auto; font-size: 12px; color: var(--muted); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background: var(--muted); margin-right:6px; }
  .dot.auth { background: var(--accent-2); }
  .hint {
    font-size: 12px; color: var(--muted); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
    margin: 12px 20px 0;
  }
  .hint code { color: var(--accent-2); }
  #messages {
    flex: 1; overflow-y: auto; padding: 16px 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg { max-width: 720px; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.5; font-size: 14px; }
  .msg.user { background: var(--user); align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.agent { background: var(--agent); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.system { background: transparent; color: var(--muted); font-style: italic; align-self: center; font-size: 12px; }
  .msg.error { background: #3a1e1e; color: var(--danger); align-self: flex-start; }
  .approval {
    align-self: flex-start; max-width: 720px; width: 100%;
    background: var(--panel-2); border: 1px solid var(--accent);
    border-radius: 12px; padding: 14px;
  }
  .approval h3 { margin: 0 0 8px; font-size: 13px; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; }
  .approval .field { font-size: 13px; margin: 4px 0; }
  .approval .field b { color: var(--muted); font-weight: 600; }
  .approval .body { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-top: 8px; white-space: pre-wrap; font-size: 13px; }
  .approval .actions { margin-top: 12px; display: flex; gap: 10px; }
  button {
    font: inherit; border: none; border-radius: 8px; padding: 9px 16px;
    cursor: pointer; font-weight: 600; font-size: 13px;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-approve { background: var(--accent-2); color: #062318; }
  .btn-reject { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  form {
    display: flex; gap: 10px; padding: 14px 20px;
    border-top: 1px solid var(--border); background: var(--panel);
  }
  #input {
    flex: 1; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 11px 14px; font: inherit; resize: none;
  }
  #input:focus { outline: none; border-color: var(--accent); }
  .btn-send { background: var(--accent); color: #fff; }
  .typing { color: var(--muted); font-size: 12px; align-self: flex-start; }
</style>
</head>
<body>
  <header>
    <h1>📧 Email Assistant</h1>
    <span class="status"><span id="statusDot" class="dot"></span><span id="statusText">not authenticated</span></span>
  </header>

  <div class="hint">
    Try: log in with <code>julie@example.com, password123</code>, then ask the assistant to check the inbox and draft a reply.
    When it wants to send, you'll get an approve/reject prompt.
  </div>

  <div id="messages"></div>

  <form id="chatForm">
    <textarea id="input" rows="1" placeholder="Type a message… (Enter to send, Shift+Enter for newline)" autofocus></textarea>
    <button type="submit" class="btn-send" id="sendBtn">Send</button>
  </form>

<script>
  const sessionId = "sess-" + Math.random().toString(36).slice(2);
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("chatForm");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  let authenticated = false;

  function addMessage(text, cls) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  function addTyping() {
    const el = document.createElement("div");
    el.className = "typing";
    el.textContent = "assistant is thinking…";
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  function markAuthenticated() {
    if (authenticated) return;
    authenticated = true;
    statusDot.classList.add("auth");
    statusText.textContent = "authenticated";
  }

  function renderApproval(email) {
    const wrap = document.createElement("div");
    wrap.className = "approval";
    wrap.innerHTML = `
      <h3>Approve sending this email?</h3>
      <div class="field"><b>To:</b> ${escapeHtml(email.to)}</div>
      <div class="field"><b>Subject:</b> ${escapeHtml(email.subject)}</div>
      <div class="body">${escapeHtml(email.body)}</div>
      <div class="actions">
        <button class="btn-approve">Approve &amp; send</button>
        <button class="btn-reject">Reject</button>
      </div>`;
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    const approveBtn = wrap.querySelector(".btn-approve");
    const rejectBtn = wrap.querySelector(".btn-reject");
    approveBtn.onclick = () => decide(wrap, "approve");
    rejectBtn.onclick = () => decide(wrap, "reject");
  }

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function handlePayload(data) {
    if (data.error) { addMessage("Error: " + data.error, "error"); return; }
    if (data.reply) addMessage(data.reply, "agent");
    // Any successful turn beyond login implies we were let in.
    if (data.reply && /inbox|jane|coffee|draft/i.test(data.reply)) markAuthenticated();
    if (data.awaiting_approval && data.pending_email) renderApproval(data.pending_email);
  }

  async function sendMessage(text) {
    addMessage(text, "user");
    const typing = addTyping();
    sendBtn.disabled = true;
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });
      const data = await res.json();
      typing.remove();
      handlePayload(data);
    } catch (e) {
      typing.remove();
      addMessage("Network error: " + e.message, "error");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  async function decide(wrap, choice) {
    wrap.querySelectorAll("button").forEach(b => b.disabled = true);
    addMessage(choice === "approve" ? "✓ Approved" : "✗ Rejected", "system");
    const typing = addTyping();
    try {
      const res = await fetch("/api/decision", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, decision: choice }),
      });
      const data = await res.json();
      typing.remove();
      handlePayload(data);
    } catch (e) {
      typing.remove();
      addMessage("Network error: " + e.message, "error");
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    input.style.height = "auto";
    sendMessage(text);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });

  addMessage("Hi! Please authenticate to access your inbox.", "agent");
</script>
</body>
</html>
